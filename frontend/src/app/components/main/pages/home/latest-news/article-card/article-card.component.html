<article [id]="id()">
  <!--            <a href="#" class="image"><img src="images/pic01.jpg" alt="" /></a>-->
  <h3>{{ title() }}</h3>
  <small>{{ createdAt() }}</small>
  <p>{{ content() }}</p>
  @if (isContentTruncated) {
    <ul class="actions">
      <li>
        <a [routerLink]="['/notizie', slug()]" class="button">Continua a leggere...</a>
      </li>
    </ul>
  }
</article>
