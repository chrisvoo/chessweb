<!-- Section -->
<page title="Ultime notizie">
  <div class="posts">
    @for (article of articles; track article.id) {
      <chess-article-card
        [title]="article.title"
        [content]="article.content"
        [id]="article.id!"
        [createdAt]="article.created_at ?? ''"
      ></chess-article-card>
    }
  </div>
</page>
